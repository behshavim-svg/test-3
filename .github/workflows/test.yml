name: Deploy test

on:
  repository_dispatch:
    types: [start-xray]
  workflow_dispatch:

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Config Folder
        run: mkdir -p ./xray-config

      - name: Write Xray Config
        run: |
          cat <<EOF > ./xray-config/config.json
          {
            "log": {
              "loglevel": "info"
            },
            "reverse": {
              "bridges": [
                {
                  "tag": "bridge-cctv",
                  "domain": "tunnel.cctv.internal"
                },
                {
                  "tag": "bridge-ai",
                  "domain": "tunnel.ai.internal"
                }
              ]
            },
            "outbounds": [
              {
                "tag": "tunnel-to-cctv",
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "${{ secrets.DOMAIN1 }}",
                      "port": 443,
                      "users": [
                        {
                          "id": "${{ secrets.UUID1 }}",
                          "encryption": "none"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "allowInsecure": true,
                    "serverName": "${{ secrets.DOMAIN1 }}"
                  },
                  "wsSettings": {
                    "path": "/edge",
                    "headers": {
                      "Host": "${{ secrets.DOMAIN1 }}"
                    }
                  }
                },
                "mux": {
                  "enabled": true,
                  "concurrency": 8
                }
              },
              {
                "tag": "tunnel-to-ai",
                "protocol": "vless",
                "settings": {
                  "vnext": [
                    {
                      "address": "${{ secrets.DOMAIN2 }}",
                      "port": 443,
                      "users": [
                        {
                          "id": "${{ secrets.UUID2 }}",
                          "encryption": "none"
                        }
                      ]
                    }
                  ]
                },
                "streamSettings": {
                  "network": "ws",
                  "security": "tls",
                  "tlsSettings": {
                    "allowInsecure": true,
                    "serverName": "${{ secrets.DOMAIN2 }}"
                  },
                  "wsSettings": {
                    "path": "/edge",
                    "headers": {
                      "Host": "${{ secrets.DOMAIN2 }}"
                    }
                  }
                },
                "mux": {
                  "enabled": true,
                  "concurrency": 8
                }
              },
              {
                "tag": "out-direct",
                "protocol": "freedom",
                "settings": {},
                "streamSettings": {
                  "sockopt": {
                    "tcpKeepAliveIdle": 15,
                    "tcpKeepAliveInterval": 15
                  }
                }
              }
            ],
            "routing": {
              "rules": [
                {
                  "type": "field",
                  "domain": [
                    "full:tunnel.cctv.internal"
                  ],
                  "outboundTag": "tunnel-to-cctv"
                },
                {
                  "type": "field",
                  "domain": [
                    "full:tunnel.ai.internal"
                  ],
                  "outboundTag": "tunnel-to-ai"
                },
                {
                  "type": "field",
                  "inboundTag": [
                    "bridge-cctv",
                    "bridge-ai"
                  ],
                  "outboundTag": "out-direct"
                }
              ]
            }
          }
          EOF
          
      - name: Debug Network Connectivity
        run: |
          # Test if the runner can resolve the domain and reach port 443
          echo "Testing connectivity to domain 1..."
          curl -I -v -m 10 https://${{ secrets.DOMAIN1 }}/edge || echo "Failed to reach DOMAIN1"
          
          echo "Testing connectivity to domain 2..."
          curl -I -v -m 10 https://${{ secrets.DOMAIN2 }}/edge || echo "Failed to reach DOMAIN2"
          
          # Test direct IP ping to see if the server drops ICMP packets
          echo "Pinging the server IP directly..."
          ping -c 4 185.97.118.182 || echo "Ping failed"
          
      - name: Run Xray
        run: |
          docker run -d --name xray-bridge \
            -v $(pwd)/xray-config:/etc/xray \
            teddysun/xray:24.11.30 \
            xray -config /etc/xray/config.json
          
          sleep 10
          docker logs -f xray-bridge &
          sleep 18000
